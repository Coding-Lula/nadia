<script>
  let globalAccounts = [];
  let globalCategories = [];
  let globalDebts = [];
  let globalTransactions = [];
  let chartInstance = null;

  window.onload = function() {
    loadInitialData();

    // Close any open action menu when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.action-menu-container')) {
        closeAllActionMenus();
      }
    });
  };

  function switchTab(tabId, title) {
    // Hide all views
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    // Un-highlight all nav tabs
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

    const txDateEl = document.getElementById('tx-date');
    if (txDateEl && !txDateEl.value) {
      txDateEl.value = new Date().toISOString().split('T')[0];
    }

    // Activate target view
    const targetView = document.getElementById(`view-${tabId}`);
    if (targetView) targetView.classList.add('active');

    // Highlight target nav tab
    const targetNav = document.getElementById(`nav-${tabId}`);
    if (targetNav) targetNav.classList.add('active');

    const titleEl = document.getElementById('page-title');
    if (titleEl) titleEl.innerText = title;

    if (tabId === 'transactions') {
      loadGlobalTransactions();
    }
  }

  function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
  }

  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
  }

  function openAddCategoryModalWithType(type) {
    const typeSelect = document.getElementById('new-cat-type');
    if (typeSelect) typeSelect.value = type;
    openModal('modal-add-cat');
  }

  /* TRANSACTION TYPE SWITCHER (CREATE) */
  function selectTxType(type) {
    document.getElementById('tx-type').value = type;
    const btnExp = document.getElementById('btn-type-expense');
    const btnInc = document.getElementById('btn-type-income');
    const btnTrf = document.getElementById('btn-type-transfer');

    btnExp.className = 'type-btn';
    btnInc.className = 'type-btn';
    btnTrf.className = 'type-btn';

    if (type === 'Expense') btnExp.classList.add('active-expense');
    if (type === 'Income') btnInc.classList.add('active-income');
    if (type === 'Transfer') btnTrf.classList.add('active-transfer');

    document.getElementById('target-acc-group').style.display = (type === 'Transfer') ? 'block' : 'none';

    const debtToggleGroup = document.getElementById('debt-toggle-group');
    if (debtToggleGroup) {
      debtToggleGroup.style.display = (type === 'Transfer') ? 'none' : 'block';
    }

    if (type === 'Transfer') {
      document.getElementById('cat-group').style.display = 'none';
      document.getElementById('debt-group').style.display = 'none';
      const debtCheckbox = document.getElementById('tx-is-debt');
      if (debtCheckbox) debtCheckbox.checked = false;
    } else {
      toggleDebtMode();
    }
  }

  function toggleDebtMode() {
    const isDebt = document.getElementById('tx-is-debt').checked;
    const type = document.getElementById('tx-type').value;

    if (type === 'Transfer') return;

    if (isDebt) {
      document.getElementById('debt-group').style.display = 'block';
      document.getElementById('cat-group').style.display = 'none';
      populateDebtDropdown();
    } else {
      document.getElementById('debt-group').style.display = 'none';
      document.getElementById('cat-group').style.display = 'block';
    }
  }

  function populateDebtDropdown() {
    const debtSelect = document.getElementById('tx-debt');
    if (!debtSelect) return;
    debtSelect.innerHTML = '';

    const type = document.getElementById('tx-type').value;
    const targetType = (type === 'Income') ? 'Lend' : 'Borrow';

    const filteredDebts = globalDebts.filter(d => d.type === targetType && (d.totalAmount - d.paidAmount) > 0);

    if (filteredDebts.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.innerText = 'Nenhuma dívida encontrada';
      debtSelect.appendChild(opt);
      return;
    }

    filteredDebts.forEach(d => {
      const remaining = d.totalAmount - d.paidAmount;
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.innerText = `${d.person} (Restante: ${remaining.toFixed(2)} MT)`;
      debtSelect.appendChild(opt);
    });
  }

  /* TRANSACTION TYPE SWITCHER (EDIT) */
  function selectEditTxType(type) {
    document.getElementById('edit-tx-type').value = type;
    const btnExp = document.getElementById('edit-btn-type-expense');
    const btnInc = document.getElementById('edit-btn-type-income');
    const btnTrf = document.getElementById('edit-btn-type-transfer');

    btnExp.className = 'type-btn';
    btnInc.className = 'type-btn';
    btnTrf.className = 'type-btn';

    if (type === 'Expense') btnExp.classList.add('active-expense');
    if (type === 'Income') btnInc.classList.add('active-income');
    if (type === 'Transfer') btnTrf.classList.add('active-transfer');

    const targetAccGroup = document.getElementById('edit-target-acc-group');
    const debtToggleGroup = document.getElementById('edit-debt-toggle-group');

    if (targetAccGroup) targetAccGroup.style.display = (type === 'Transfer') ? 'block' : 'none';
    if (debtToggleGroup) debtToggleGroup.style.display = (type === 'Transfer') ? 'none' : 'block';

    if (type === 'Transfer') {
      document.getElementById('edit-cat-group').style.display = 'none';
      document.getElementById('edit-debt-group').style.display = 'none';
      const debtCheckbox = document.getElementById('edit-tx-is-debt');
      if (debtCheckbox) debtCheckbox.checked = false;
    } else {
      toggleEditDebtMode();
    }
  }

  function toggleEditDebtMode(preserveDebtId) {
    const isDebt = document.getElementById('edit-tx-is-debt').checked;
    const type = document.getElementById('edit-tx-type').value;

    if (type === 'Transfer') return;

    if (isDebt) {
      document.getElementById('edit-debt-group').style.display = 'block';
      document.getElementById('edit-cat-group').style.display = 'none';
      populateEditDebtDropdown(preserveDebtId);
    } else {
      document.getElementById('edit-debt-group').style.display = 'none';
      document.getElementById('edit-cat-group').style.display = 'block';
    }
  }

  function populateEditDebtDropdown(selectedDebtId) {
    const debtSelect = document.getElementById('edit-tx-debt');
    if (!debtSelect) return;
    debtSelect.innerHTML = '';

    const type = document.getElementById('edit-tx-type').value;
    const targetType = (type === 'Income') ? 'Lend' : 'Borrow';

    // Filter debts matching targetType. Also allow the currently assigned debt even if remaining is 0
    const filteredDebts = globalDebts.filter(d => d.type === targetType && ((d.totalAmount - d.paidAmount) > 0 || d.id === selectedDebtId));

    if (filteredDebts.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.innerText = 'Nenhuma dívida encontrada';
      debtSelect.appendChild(opt);
      return;
    }

    filteredDebts.forEach(d => {
      const remaining = d.totalAmount - d.paidAmount;
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.innerText = `${d.person} (Restante: ${remaining.toFixed(2)} MT)`;
      debtSelect.appendChild(opt);
    });

    if (selectedDebtId) {
      debtSelect.value = selectedDebtId;
    }
  }

  function loadInitialData() {
    // 1. Accounts
    google.script.run.withSuccessHandler(data => {
      globalAccounts = data.accounts;
      const balEl = document.getElementById('dash-total-balance');
      if (balEl) balEl.innerText = `${data.totalBalance.toFixed(2)} MT`;
      populateAccountDropdowns();
      renderAccountsList(data.accounts);
    }).getAccountsOverview();

    // 2. Current Month Totals
    google.script.run.withSuccessHandler(summary => {
      const incEl = document.getElementById('dash-total-income');
      const expEl = document.getElementById('dash-total-expense');
      if (incEl) incEl.innerText = `${summary.monthlyIncome.toFixed(2)} MT`;
      if (expEl) expEl.innerText = `${summary.monthlyExpense.toFixed(2)} MT`;
    }).getCurrentMonthSummary();

    // 3. Categories
    google.script.run.withSuccessHandler(cats => {
      globalCategories = cats;
      populateCategoryDropdowns();
      renderCategoriesList(cats);
    }).getCategories();

    // 4. Debts
    google.script.run.withSuccessHandler(debts => {
      globalDebts = debts;
      renderDebtsList(debts);
      populateDebtDropdown();
    }).getDebts();

    // 5. Summary Category Chart
    if (google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(chartData => {
          renderCategoryChart(chartData);
        })
        .withFailureHandler(err => {
          console.error("Error fetching category expense breakdown:", err);
          renderCategoryChart({ labels: [], values: [] });
        })
        .getCategoryExpenseBreakdown();
    }
  }

  function loadGlobalTransactions() {
    google.script.run.withSuccessHandler(transactions => {
      globalTransactions = transactions;
      renderGlobalTransactions(transactions);
    }).getRecentTransactions();
  }

  /* RENDER GLOBAL TRANSACTIONS (Histórico de Transações) */
  function renderGlobalTransactions(transactions) {
    const tbody = document.getElementById('global-tx-table-body');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!transactions || transactions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Nenhuma transação encontrada.</td></tr>';
      return;
    }

    transactions.forEach(tx => {
      const tr = document.createElement('tr');
      const isCredit = tx.amount > 0;
      const displayAmount = Math.abs(tx.amount).toFixed(2);

      tr.innerHTML = `
        <td>
          <strong>${tx.category || (tx.type === 'Transfer' ? 'Transferência' : 'Geral')}</strong><br>
          <small style="color: var(--text-muted);">${tx.date}</small>
        </td>
        <td>
          <div style="font-weight: 500;">${tx.description || '-'}</div>
          <small style="color: var(--text-muted);">💳 ${tx.accountName || '-'}</small>
        </td>
        <td class="${isCredit ? 'amt-credit' : 'amt-debit'}">${displayAmount} MT</td>
        <td style="text-align: right;">
          <div class="action-menu-container">
            <button type="button" class="btn-kebab" onclick="toggleActionMenu('${tx.id}', event)">...</button>
            <div id="action-menu-${tx.id}" class="action-dropdown-menu">
              <button type="button" class="dropdown-item-btn" onclick="openViewTxModal('${tx.id}')">Ver</button>
              <button type="button" class="dropdown-item-btn" onclick="openEditTxModal('${tx.id}')">Editar</button>
              <button type="button" class="dropdown-item-btn btn-delete-text" onclick="deleteTransaction('${tx.id}')">Eliminar</button>
            </div>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleActionMenu(txId, event) {
    if (event) event.stopPropagation();
    const targetMenu = document.getElementById(`action-menu-${txId}`);
    if (!targetMenu) return;

    const isOpen = targetMenu.classList.contains('show');

    // Close all menus first
    closeAllActionMenus();

    // If it was not previously open, open it
    if (!isOpen) {
      targetMenu.classList.add('show');
      const btn = targetMenu.previousElementSibling;
      if (btn) btn.classList.add('active');
    }
  }

  function closeAllActionMenus() {
    document.querySelectorAll('.action-dropdown-menu.show').forEach(m => m.classList.remove('show'));
    document.querySelectorAll('.btn-kebab.active').forEach(b => b.classList.remove('active'));
  }

  function populateAccountDropdowns() {
    // Populate create & edit transaction dropdowns
    const txSelects = [
      document.getElementById('tx-account'),
      document.getElementById('tx-target-account'),
      document.getElementById('edit-tx-account'),
      document.getElementById('edit-tx-target-account')
    ];

    txSelects.forEach(select => {
      if (!select) return;
      const currentVal = select.value;
      select.innerHTML = '';
      globalAccounts.forEach(acc => {
        const opt = document.createElement('option');
        opt.value = acc.id;
        opt.innerText = `${acc.name} (${acc.balance.toFixed(2)} MT)`;
        select.appendChild(opt);
      });
      if (currentVal) select.value = currentVal;
    });

    // Populate Extrato Account Filter with "ALL" option
    const stmtAccSelect = document.getElementById('stmt-account');
    if (stmtAccSelect) {
      const currentVal = stmtAccSelect.value || 'ALL';
      stmtAccSelect.innerHTML = '<option value="ALL">Todas as Contas</option>';
      globalAccounts.forEach(acc => {
        const opt = document.createElement('option');
        opt.value = acc.id;
        opt.innerText = `${acc.name} (${acc.balance.toFixed(2)} MT)`;
        stmtAccSelect.appendChild(opt);
      });
      stmtAccSelect.value = currentVal;
    }
  }

  function populateCategoryDropdowns() {
    const selects = [document.getElementById('tx-category'), document.getElementById('edit-tx-category')];

    // Populate transaction forms
    selects.forEach(select => {
      if (!select) return;
      const currentVal = select.value;
      select.innerHTML = '';
      globalCategories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.name;
        opt.innerText = cat.name;
        select.appendChild(opt);
      });
      if (currentVal) select.value = currentVal;
    });

    // Populate Extrato Category Filter with "ALL" option
    const stmtCatSelect = document.getElementById('stmt-category');
    if (stmtCatSelect) {
      const currentVal = stmtCatSelect.value || 'ALL';
      stmtCatSelect.innerHTML = '<option value="ALL">Todas as Categorias</option>';
      globalCategories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.name;
        opt.innerText = cat.name;
        stmtCatSelect.appendChild(opt);
      });
      stmtCatSelect.value = currentVal;
    }
  }

  /* CREATE TRANSACTION */
  function submitTransaction(e) {
    e.preventDefault();
    const isDebt = document.getElementById('tx-is-debt').checked;
    const type = document.getElementById('tx-type').value;

    const payload = {
      type: type,
      accountId: document.getElementById('tx-account').value,
      targetAccountId: document.getElementById('tx-target-account').value,
      date: document.getElementById('tx-date').value,
      isDebt: isDebt,
      debtId: isDebt ? document.getElementById('tx-debt').value : null,
      category: isDebt ? 'Amortizar Divida' : (type === 'Transfer' ? 'Transferência' : document.getElementById('tx-category').value),
      amount: document.getElementById('tx-amount').value,
      description: document.getElementById('tx-desc').value
    };

    if (isDebt && !payload.debtId) {
      alert('Por favor, selecione uma dívida válida.');
      return;
    }

    google.script.run.withSuccessHandler(() => {
      alert('Transação guardada com sucesso!');
      document.getElementById('form-tx').reset();
      document.getElementById('tx-is-debt').checked = false;
      toggleDebtMode();
      switchTab('transactions', 'Todas as Transações');
      loadInitialData();
    }).addTransaction(payload);
  }

  /* EDIT TRANSACTION */
  function openEditTxModal(txId) {
    closeAllActionMenus();
    const tx = globalTransactions.find(t => t.id === txId);
    if (!tx) return;

    document.getElementById('edit-tx-id').value = tx.id;

    // Type
    const txType = tx.type || (tx.category === 'Transferência' ? 'Transfer' : (tx.amount > 0 ? 'Income' : 'Expense'));
    selectEditTxType(txType);

    // Account
    populateAccountDropdowns();
    if (tx.accountId) {
      document.getElementById('edit-tx-account').value = tx.accountId;
    }

    // Target Account (if transfer)
    if (tx.targetAccountId) {
      document.getElementById('edit-tx-target-account').value = tx.targetAccountId;
    }

    // Debt toggle & Debt selector
    const isDebt = Boolean(tx.debtId) || tx.category === 'Amortizar Divida';
    const debtCheckbox = document.getElementById('edit-tx-is-debt');
    if (debtCheckbox) {
      debtCheckbox.checked = isDebt;
    }
    toggleEditDebtMode(tx.debtId);

    // Date
    document.getElementById('edit-tx-date').value = tx.date || new Date().toISOString().split('T')[0];

    // Category
    populateCategoryDropdowns();
    if (tx.category) {
      document.getElementById('edit-tx-category').value = tx.category;
    }

    // Amount (positive)
    document.getElementById('edit-tx-amount').value = Math.abs(tx.amount);

    // Description
    document.getElementById('edit-tx-desc').value = tx.description || '';

    openModal('modal-edit-tx');
  }

  function submitEditTransaction(e) {
    e.preventDefault();
    const isDebt = document.getElementById('edit-tx-is-debt') ? document.getElementById('edit-tx-is-debt').checked : false;
    const type = document.getElementById('edit-tx-type').value;

    const payload = {
      id: document.getElementById('edit-tx-id').value,
      type: type,
      accountId: document.getElementById('edit-tx-account').value,
      targetAccountId: type === 'Transfer' ? document.getElementById('edit-tx-target-account').value : '',
      date: document.getElementById('edit-tx-date').value,
      isDebt: isDebt,
      debtId: isDebt ? document.getElementById('edit-tx-debt').value : null,
      category: isDebt ? 'Amortizar Divida' : (type === 'Transfer' ? 'Transferência' : document.getElementById('edit-tx-category').value),
      amount: document.getElementById('edit-tx-amount').value,
      description: document.getElementById('edit-tx-desc').value
    };

    if (isDebt && !payload.debtId) {
      alert('Por favor, selecione uma dívida válida.');
      return;
    }

    google.script.run.withSuccessHandler(() => {
      closeModal('modal-edit-tx');
      loadGlobalTransactions();
      loadInitialData();
    }).updateTransaction(payload);
  }

  /* DELETE TRANSACTION */
  function deleteTransaction(txId) {
    closeAllActionMenus();
    if (confirm('Tem a certeza que deseja eliminar esta transação?')) {
      google.script.run.withSuccessHandler(() => {
        loadGlobalTransactions();
        loadInitialData();
      }).deleteTransaction(txId);
    }
  }

  /* VIEW TRANSACTION MODAL */
  function openViewTxModal(txId) {
    closeAllActionMenus();
    const tx = globalTransactions.find(t => t.id === txId);
    if (!tx) return;

    const container = document.getElementById('view-tx-body');
    const isCredit = tx.amount > 0;
    const displayAmount = Math.abs(tx.amount).toFixed(2);

    let typeCategoryDisplay = `${tx.type || 'Transação'} — ${tx.category || 'Geral'}`;
    if (tx.type === 'Transfer' && tx.targetAccountName) {
      typeCategoryDisplay += ` (Para: ${tx.targetAccountName})`;
    }

    container.innerHTML = `
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div>
          <small style="color: var(--text-muted);">Data</small>
          <div style="font-weight: 600;">${tx.date}</div>
        </div>
        <div>
          <small style="color: var(--text-muted);">Tipo / Categoria</small>
          <div style="font-weight: 600;">${typeCategoryDisplay}</div>
        </div>
        <div>
          <small style="color: var(--text-muted);">Conta Utilizada</small>
          <div style="font-weight: 600;">💳 ${tx.accountName || 'N/A'}</div>
        </div>
        <div>
          <small style="color: var(--text-muted);">Valor</small>
          <div style="font-weight: 700; font-size: 1.2rem;" class="${isCredit ? 'amt-credit' : 'amt-debit'}">
            ${displayAmount} MT
          </div>
        </div>
        <div>
          <small style="color: var(--text-muted);">Descrição</small>
          <div style="font-weight: 500;">${tx.description || 'Sem descrição'}</div>
        </div>
      </div>
    `;

    openModal('modal-view-tx');
  }

  /* STATEMENTS */
  let currentStatementData = null;

  function fetchStatement(e) {
    e.preventDefault();
    const accId = document.getElementById('stmt-account').value;
    const start = document.getElementById('stmt-start').value;
    const end = document.getElementById('stmt-end').value;
    const type = document.getElementById('stmt-type').value;
    const category = document.getElementById('stmt-category').value;

    google.script.run.withSuccessHandler(data => {
      currentStatementData = data;
      document.getElementById('stmt-op-bal').innerText = `${data.openingBalance.toFixed(2)} MT`;
      document.getElementById('stmt-inc').innerText = `${data.totalIncome.toFixed(2)} MT`;
      document.getElementById('stmt-exp').innerText = `${data.totalExpense.toFixed(2)} MT`;
      document.getElementById('stmt-cl-bal').innerText = `${data.closingBalance.toFixed(2)} MT`;

      const tbody = document.getElementById('stmt-table-body');
      tbody.innerHTML = '';

      data.transactions.forEach(tx => {
        const tr = document.createElement('tr');
        const isCredit = tx.amount > 0;
        tr.innerHTML = `
          <td>${tx.date}</td>
          <td>
            <strong>${tx.category}</strong>
            <br><small style="color: var(--text-muted);">${tx.description || '-'}</small>
            <br><span class="badge-account">${tx.accountName}</span>
          </td>
          <td class="${isCredit ? 'amt-credit' : 'amt-debit'}">${Math.abs(tx.amount).toFixed(2)} MT</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('statement-results').style.display = 'block';
    }).getStatementData(accId, start, end, type, category);
  }

  function exportStatementToExcel() {
    if (!currentStatementData) {
      alert('Nenhum dado de extrato para exportar.');
      return;
    }

    const startDateInput = document.getElementById('stmt-start').value;
    let mmdd = '';
    if (startDateInput) {
      const parts = startDateInput.split('-');
      if (parts.length === 3) {
        mmdd = `${parts[1]}-${parts[2]}`;
      }
    }
    const filename = mmdd ? `extrato ${mmdd}.xlsx` : 'extrato.xlsx';

    const data = currentStatementData;

    const rows = [
      ['Resumo do Período'],
      ['Saldo Anterior', `${data.openingBalance.toFixed(2)} MT`],
      ['Receitas', `${data.totalIncome.toFixed(2)} MT`],
      ['Despesas', `${data.totalExpense.toFixed(2)} MT`],
      ['Saldo Final', `${data.closingBalance.toFixed(2)} MT`],
      [],
      ['Transações'],
      ['Data', 'Categoria', 'Descrição', 'Conta', 'Valor (MT)']
    ];

    data.transactions.forEach(tx => {
      rows.push([
        tx.date,
        tx.category || '',
        tx.description || '',
        tx.accountName || '',
        tx.amount
      ]);
    });

    const worksheet = XLSX.utils.aoa_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, 'Extrato');

    XLSX.writeFile(workbook, filename);
  }

  /* ACCOUNTS, CATEGORIES & DEBTS HANDLERS */
  function submitAddAccount(e) {
    e.preventDefault();
    const name = document.getElementById('new-acc-name').value;
    const type = document.getElementById('new-acc-type').value;
    const init = document.getElementById('new-acc-init').value;

    google.script.run.withSuccessHandler(() => {
      closeModal('modal-add-acc');
      loadInitialData();
    }).addAccount(name, type, init);
  }

  function submitAddCategory(e) {
    e.preventDefault();
    const name = document.getElementById('new-cat-name').value;
    const type = document.getElementById('new-cat-type').value;

    google.script.run.withSuccessHandler(() => {
      closeModal('modal-add-cat');
      loadInitialData();
    }).addCategory(name, type);
  }

  function submitAddDebt(e) {
    e.preventDefault();
    const person = document.getElementById('new-debt-person').value;
    const type = document.getElementById('new-debt-type').value;
    const amount = document.getElementById('new-debt-amount').value;
    const date = document.getElementById('new-debt-date').value;

    google.script.run.withSuccessHandler(() => {
      closeModal('modal-add-debt');
      loadInitialData();
    }).addDebt(person, type, amount, date);
  }

  function deleteCategory(id) {
    if (confirm('Tem a certeza que deseja eliminar esta despesa?')) {
      google.script.run.withSuccessHandler(() => loadInitialData()).deleteCategory(id);
    }
  }

  function renderAccountsList(accounts) {
    const container = document.getElementById('accounts-list');
    if (!container) return;
    container.innerHTML = '';
    accounts.forEach(acc => {
      container.innerHTML += `
        <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);">
          <div><strong>${acc.name}</strong><br><small style="color: var(--text-muted);">${acc.type}</small></div>
          <div style="font-weight: 700;">${acc.balance.toFixed(2)} MT</div>
        </div>
      `;
    });
  }

  function renderCategoriesList(categories) {
    const expenseContainer = document.getElementById('expense-categories-list');
    const incomeContainer = document.getElementById('income-categories-list');

    if (expenseContainer) expenseContainer.innerHTML = '';
    if (incomeContainer) incomeContainer.innerHTML = '';

    categories.forEach(cat => {
      const html = `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border);">
          <span><strong>${cat.name}</strong></span>
          <button class="btn-danger-sm" onclick="deleteCategory('${cat.id}')">Eliminar</button>
        </div>
      `;

      if (cat.type === 'Income' && incomeContainer) {
        incomeContainer.innerHTML += html;
      } else if (cat.type === 'Expense' && expenseContainer) {
        expenseContainer.innerHTML += html;
      }
    });
  }

  function renderDebtsList(debts) {
    const container = document.getElementById('debts-list');
    if (!container) return;
    container.innerHTML = '';
    if (debts.length === 0) {
      container.innerHTML = '<small style="color: var(--text-muted);">Nenhuma dívida registada.</small>';
      return;
    }
    debts.forEach(d => {
      const remaining = d.totalAmount - d.paidAmount;
      container.innerHTML += `
        <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);">
          <div><strong>${d.person}</strong> (${d.type === 'Lend' ? 'Emprestado' : 'Dívida'})<br><small>Vencimento: ${d.dueDate}</small></div>
          <div style="font-weight: 700; color: ${d.type === 'Lend' ? 'var(--success)' : 'var(--danger)'};">${remaining.toFixed(2)} MT</div>
        </div>
      `;
    });
  }

  function renderCategoryChart(data) {
    const canvas = document.getElementById('categoryChart');
    const overlay = document.getElementById('chart-center-overlay');
    const amountEl = document.getElementById('chart-center-amount');
    const legendEl = document.getElementById('categoryChartLegend');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');

    if (chartInstance) {
      chartInstance.destroy();
      chartInstance = null;
    }

    if (legendEl) legendEl.innerHTML = '';

    if (!data || !data.labels || data.labels.length === 0 || !data.values || data.values.length === 0) {
      if (overlay) overlay.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#9ca3af';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Sem despesas este mês', canvas.width / 2, canvas.height / 2);
      return;
    }

    const totalSpent = data.values.reduce((sum, v) => sum + (Number(v) || 0), 0);

    // Color palette matching the reference image (forest green, mint green, sage, dark spruce, slate/taupe)
    const referenceColors = [
      '#1e4620', // deep forest green
      '#437a4a', // medium green
      '#8bc38f', // light mint green
      '#b2d8b5', // pale sage green
      '#a2b9a7', // soft grey-green
      '#607d6b', // slate spruce
      '#355e3b', // hunter green
      '#809b82'  // muted sage
    ];

    const backgroundColors = data.labels.map((_, i) => referenceColors[i % referenceColors.length]);

    if (overlay && amountEl) {
      amountEl.innerText = `${totalSpent.toFixed(2)} MT`;
      overlay.style.display = 'block';
    }

    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: data.labels,
        datasets: [{
          data: data.values,
          backgroundColor: backgroundColors,
          borderWidth: 2,
          borderColor: '#ffffff',
          hoverOffset: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '72%',
        plugins: {
          legend: {
            display: false // We use our custom matching grid legend below
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const val = context.parsed || 0;
                const pct = totalSpent > 0 ? ((val / totalSpent) * 100).toFixed(1) : 0;
                return ` ${context.label}: ${val.toFixed(2)} MT (${pct}%)`;
              }
            }
          }
        }
      }
    });

    // Render custom legend matching reference image
    if (legendEl) {
      legendEl.innerHTML = '';
      data.labels.forEach((label, idx) => {
        const val = Number(data.values[idx]) || 0;
        const pct = totalSpent > 0 ? Math.round((val / totalSpent) * 100) : 0;
        const color = backgroundColors[idx];

        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `
          <div class="legend-item-left" title="${label}">
            <span class="legend-dot" style="background-color: ${color};"></span>
            <span class="legend-label">${label}</span>
          </div>
          <span class="legend-percent">${pct}%</span>
        `;
        legendEl.appendChild(item);
      });
    }
  }
</script>
